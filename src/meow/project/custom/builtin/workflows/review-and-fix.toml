description = "Review existing code, fix findings until review passes, then run checks."

[[steps]]
id = "rounds"
loop = [
  { id = "fix", uses = "builtin.generate", when = "round > 1" },
  { id = "verify", uses = "builtin.verify", when = "checks_configured" },
  { id = "review", uses = "builtin.review", when = "steps.verify.status != 'FAIL'" },
]

[[steps]]
id = "checks"
uses = "builtin.checks"
