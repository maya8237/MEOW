description = "Plan, implement, review, check, and deliver."

[[steps]]
id = "plan"
uses = "builtin.plan"
when = "not plan_given and not resume_review"

[[steps]]
id = "plan-check"
loop = [
  { id = "revise-plan", uses = "builtin.plan", when = "round > 1 and not plan_given and not resume_review" },
  { id = "plan-checker", gate = "plan-checker", when = "not plan_given and not resume_review" },
]
max_rounds = 2

[[steps]]
id = "approve"
uses = "builtin.approve_plan"

[[steps]]
id = "tasks"
uses = "builtin.tasks"
when = "not resume_review"

[[steps]]
id = "rounds"
loop = [
  { id = "generate", uses = "builtin.generate", when = "round > 1 or not review_first" },
  { id = "verify", uses = "builtin.verify", when = "checks_configured" },
  { id = "review", uses = "builtin.review", when = "steps.verify.status != 'FAIL'" },
]

[[steps]]
id = "checks"
uses = "builtin.checks"

[[steps]]
id = "deliver"
uses = "builtin.deliver"
