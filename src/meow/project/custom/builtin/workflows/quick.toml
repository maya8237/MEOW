description = "Short plan, implement, run checks before review, then deliver."
auto_test = false
short_plan = true

[[steps]]
id = "plan"
uses = "builtin.plan"
when = "not plan_given and not resume_review"

[[steps]]
id = "approve"
uses = "builtin.approve_plan"

[[steps]]
id = "rounds"
loop = [
  { id = "generate", uses = "builtin.generate", when = "round > 1 or not review_first" },
  { id = "verify", uses = "builtin.verify", when = "checks_configured" },
  { id = "review", uses = "builtin.review", when = "steps.verify.status != 'FAIL'" },
]
max_rounds = 3

[[steps]]
id = "checks"
uses = "builtin.checks"

[[steps]]
id = "deliver"
uses = "builtin.deliver"
