<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEOW catalog</title>
<link rel="icon" href="/logo.png">
<style>
  :root {
    color-scheme: dark;
    --bg: #120d1d;
    --panel: #1c1430;
    --field: #0d0919;
    --text: #ece6ff;
    --muted: #a396c9;
    --line: #3b2d5e;
    --accent: #a855f7;
    --accent-soft: #a855f733;
    --accent-text: #d8b4fe;
    --danger: #f87171;
  }
  * { box-sizing: border-box; }
  @font-face { font-family: "JetBrains Mono"; src: url("/fonts/JetBrainsMono-Regular.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "JetBrains Mono"; src: url("/fonts/JetBrainsMono-Bold.woff2") format("woff2"); font-weight: 700; }
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header img { width: 32px; height: 32px; flex-shrink: 0; filter: drop-shadow(0 0 6px #a855f1aa); }
  header h1 { font-size: 16px; margin: 0; flex-shrink: 0; white-space: nowrap; }
  nav { display: flex; flex-shrink: 0; white-space: nowrap; }
  nav button { background: none; border: 0; padding: 6px 10px; cursor: pointer; color: inherit; border-bottom: 2px solid transparent; }
  nav button[aria-selected="true"] { border-bottom-color: var(--accent); font-weight: 600; color: var(--accent-text); }
  nav .count { color: var(--muted); font-size: 12px; }
  #new { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-weight: 600; flex-shrink: 0; white-space: nowrap; }
  #new:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
  input, select { background: var(--field); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; }
  input:focus, select:focus { outline: 1px solid var(--accent); }
  #repo-filter { flex: 1; min-width: 0; }
  #search { margin-left: auto; min-width: 220px; }
  main { flex: 1; display: grid; grid-template-columns: minmax(220px, 320px) 1fr; min-height: 0; }
  aside { border-right: 1px solid var(--line); overflow: auto; }
  aside ul { list-style: none; margin: 0; padding: 0; }
  aside li button { width: 100%; text-align: left; background: none; border: 0; padding: 8px 12px; cursor: pointer; color: inherit; border-bottom: 1px solid var(--line); }
  aside li button:hover { background: var(--accent-soft); }
  aside li button[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 var(--accent); }
  .name { font-weight: 600; }
  .desc { color: var(--muted); font-size: 12px; }
  section.detail { overflow: auto; padding: 16px 20px; }
  h2 { margin-top: 0; color: #f3e8ff; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--accent); color: var(--accent-text); margin-right: 6px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 12px 0; }
  dt { color: var(--muted); }
  dd { margin: 0; word-break: break-all; }
  pre { background: var(--field); border: 1px solid var(--line); padding: 12px; border-radius: 6px; overflow: auto; white-space: pre-wrap; font: 13px/1.5 "JetBrains Mono", Consolas, ui-monospace, monospace; }
  .error { background: #7f1d1d55; border: 1px solid var(--danger); padding: 10px 12px; margin: 10px 16px 0; border-radius: 6px; white-space: pre-wrap; }
  .notes { color: var(--muted); font-size: 12px; padding: 10px 12px; border-top: 1px solid var(--line); }
  .empty { color: var(--muted); padding: 16px; }
  form { display: grid; gap: 12px; max-width: 520px; }
  form label { display: grid; gap: 4px; color: var(--muted); }
  form button { justify-self: start; background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 7px 14px; cursor: pointer; font-weight: 600; }
  .hint { color: var(--muted); font-size: 12px; }
  .run h3 { font-size: 14px; margin: 16px 0 8px; color: #f3e8ff; }
  .command { margin-bottom: 10px; }
  .command pre { margin: 4px 0; }
  button.copy { background: var(--accent-soft); color: var(--accent-text); border: 1px solid var(--accent); border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
  .form-status { color: var(--danger); min-height: 1.4em; }
</style>
</head>
<body>
<header>
  <img src="/logo.png" alt="">
  <h1>MEOW catalog</h1>
  <nav id="tabs"></nav>
  <select id="repo-filter" aria-label="Repo"></select>
  <button id="new" type="button">+ New</button>
  <input id="search" type="search" placeholder="Filter by name or description">
</header>
<div id="error" class="error" hidden></div>
<main>
  <aside>
    <ul id="list"></ul>
    <div id="notes" class="notes" hidden></div>
  </aside>
  <section id="detail" class="detail"></section>
</main>
<script>
const TABS = [
  ["workflows", "Workflows"],
  ["agents", "Agents"],
  ["skills", "Skills"],
];
const state = { data: null, tab: "workflows", query: "", selected: null, creating: false, createKind: "workflows", created: null, repo: "" };
const $ = (id) => document.getElementById(id);

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === "text") node.textContent = value;
    else if (key === "className") node.className = value;
    else node.setAttribute(key, value);
  }
  for (const child of children) node.append(child);
  return node;
}

function keyOf(item) {
  return item.file || item.directory;
}

function sameItem(a, b) {
  return Boolean(a && b) && keyOf(a) === keyOf(b);
}

function where(item) {
  if (item.repo) return item.repo;
  return item.scope === "builtin" ? "built in" : "all repositories";
}

function items() {
  const all = state.data ? state.data[state.tab] : [];
  const query = state.query.trim().toLowerCase();
  if (!query) return all;
  return all.filter((item) =>
    item.name.toLowerCase().includes(query) ||
    (item.description || "").toLowerCase().includes(query));
}

function renderTabs() {
  const nav = $("tabs");
  nav.replaceChildren(...TABS.map(([key, label]) => {
    const count = state.data ? state.data[key].length : 0;
    const button = el("button", { role: "tab", "aria-selected": String(key === state.tab) }, [
      document.createTextNode(label + " "),
      el("span", { className: "count", text: `(${count})` }),
    ]);
    button.addEventListener("click", () => {
      state.tab = key;
      state.selected = null;
      state.creating = false;
      state.created = null;
      render();
    });
    return button;
  }));
}

function renderList() {
  const list = items();
  if (!list.some((item) => sameItem(item, state.selected))) {
    state.selected = list[0] || null;
  }
  const rows = list.map((item) => {
    const button = el("button", { "aria-current": String(sameItem(item, state.selected)) }, [
      el("div", { className: "name", text: item.name }),
      el("div", { className: "desc", text: item.description || "" }),
      el("div", { className: "desc", text: where(item) }),
    ]);
    button.addEventListener("click", () => {
      state.selected = item;
      state.creating = false;
      state.created = null;
      render();
    });
    return el("li", {}, [button]);
  });
  $("list").replaceChildren(...rows);
  if (!rows.length) {
    $("list").replaceChildren(el("li", { className: "empty", text: "Nothing matches." }));
  }
}

function field(label, value) {
  if (value === null || value === undefined || value === "" || (Array.isArray(value) && !value.length)) {
    return null;
  }
  const text = Array.isArray(value) ? value.join(", ") : String(value);
  return [el("dt", { text: label }), el("dd", { text })];
}

function savedNotice() {
  if (!state.created) return [];
  const path = state.created;
  const button = el("button", { type: "button", className: "copy", text: "Copy path" });
  button.addEventListener("click", async () => {
    await navigator.clipboard.writeText(path);
    button.textContent = "Copied";
    setTimeout(() => { button.textContent = "Copy path"; }, 1500);
  });
  return [el("div", { className: "command" }, [
    el("div", { className: "hint", text: "Saved to" }),
    el("pre", { text: path }),
    button,
  ])];
}

function renderDetail() {
  const detail = $("detail");
  if (state.creating) {
    renderCreateForm();
    return;
  }
  const item = state.selected;
  if (!item) {
    const text = state.data && state.data.error
      ? "The catalog could not load. Fix the error above."
      : items().length ? "Select an item." : "Nothing here yet. Use + New to create one.";
    detail.replaceChildren(...savedNotice(), el("div", { className: "empty", text }));
    return;
  }
  const badges = [el("span", { className: "badge", text: item.scope })];
  if (item.ejected) badges.push(el("span", { className: "badge", text: "ejected" }));
  if (item.delegate) badges.push(el("span", { className: "badge", text: "delegate" }));
  const facts = {
    workflows: [
      ["File", item.file],
      ["Steps", (item.steps || []).map((step) => `${step.id} (${step.kind})`)],
    ],
    agents: [
      ["File", item.file],
      ["Role", item.role],
      ["Tools", item.tools === null ? "inherited" : item.tools],
      ["Model", item.model || "inherited"],
      ["Skills", item.skills],
    ],
    skills: [
      ["Qualified name", item.qualified_name],
      ["Directory", item.directory],
    ],
  }[state.tab];
  const rows = [["Repo", where(item)], ...facts].map(([label, value]) => field(label, value)).filter(Boolean).flat();
  const run = state.tab === "workflows" ? [runSection(item)] : [];
  detail.replaceChildren(
    ...savedNotice(),
    el("h2", { text: item.name }),
    el("div", {}, badges),
    el("p", { text: item.description || "" }),
    el("dl", {}, rows),
    ...run,
    el("pre", { text: item.text }),
  );
}

function runSection(item) {
  const workDir = item.repo ? ` --work-dir "${item.repo}"` : "";
  const commands = [
    ["Terminal", `meow run "<request>" --workflow ${item.name}${workDir} --name "<feature-name>"`],
    ["Claude Code", `/meow:run --workflow ${item.name} "<request>"`],
  ];
  return el("div", { className: "run" }, [
    el("h3", { text: "Run this workflow" }),
    ...commands.map(([label, text]) => commandBlock(label, text)),
  ]);
}

function commandBlock(label, text) {
  const button = el("button", { type: "button", className: "copy", text: "Copy" });
  button.addEventListener("click", async () => {
    await navigator.clipboard.writeText(text);
    button.textContent = "Copied";
    setTimeout(() => { button.textContent = "Copy"; }, 1500);
  });
  return el("div", { className: "command" }, [
    el("div", { className: "hint", text: label }),
    el("pre", { text }),
    button,
  ]);
}

function renderCreateForm() {
  const kind = state.createKind;
  const singular = kind.slice(0, -1);
  const status = el("div", { className: "form-status", role: "alert" });
  const kindPicker = el("select", { name: "kind" }, TABS.map(([key, label]) => el("option", { value: key, text: label })));
  kindPicker.value = kind;
  kindPicker.addEventListener("change", () => {
    state.createKind = kindPicker.value;
    renderCreateForm();
  });
  const name = el("input", { name: "name", required: "", pattern: "[a-z][a-z0-9_\\-]{0,62}", placeholder: "e.g. nightly-docs" });
  const description = el("input", { name: "description", required: "", placeholder: "What it is for" });
  const repo = el("select", { name: "repo" }, (state.data.repos || []).map((path) => el("option", { value: path, text: path })));
  if (state.repo) repo.value = state.repo;
  const sourceOptions = () => {
    const options = (state.data[kind] || [])
      .filter((item) => !item.repo || item.repo === repo.value)
      .map((item) => {
        const option = el("option", { value: item.name, text: `${item.name} (${item.scope})` });
        if (kind !== "skills" && state.selected && item.name === state.selected.name) option.selected = true;
        return option;
      });
    if (kind === "skills") {
      options.unshift(el("option", { value: "", text: "Blank skill" }));
    }
    return options;
  };
  const source = el("select", { name: "source" }, sourceOptions());
  repo.addEventListener("change", () => source.replaceChildren(...sourceOptions()));
  const scope = el("select", { name: "scope" }, [
    el("option", { value: "project", text: "Project (.meow, shared in the repo)" }),
    el("option", { value: "local", text: "Local (.meow/local, local and git-ignored)" }),
    el("option", { value: "user", text: "User (~/.meow, all your projects)" }),
  ]);
  scope.addEventListener("change", () => { repo.disabled = scope.value === "user"; });
  const hint = kind === "skills"
    ? "Creates a SKILL.md in the scope's MEOW plugin (plugin/skills/) and registers that plugin with Claude Code."
    : `Copies the chosen ${singular} under the new name. Edit the new file afterwards to change it.`;
  const form = el("form", {}, [
    el("h2", { text: "New item" }),
    el("label", {}, [el("span", { text: "Kind" }), kindPicker]),
    el("p", { className: "hint", text: hint }),
    el("label", {}, [el("span", { text: "Name" }), name]),
    el("label", {}, [el("span", { text: "Description" }), description]),
    el("label", {}, [el("span", { text: kind === "skills" ? "Start from" : `Copy from ${singular}` }), source]),
    el("label", {}, [el("span", { text: "Save to" }), scope]),
    el("label", {}, [el("span", { text: "Repo" }), repo]),
    el("button", { type: "submit", text: `Create ${singular}` }),
    status,
  ]);
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    status.textContent = "";
    const response = await fetch(`/api/${kind}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name.value, description: description.value, source: source.value, scope: scope.value, repo: repo.value }),
    });
    const result = await response.json();
    if (!response.ok) {
      status.textContent = result.error;
      return;
    }
    state.creating = false;
    await load();
    const folder = result.file.replace(/[\\/]SKILL\.md$/, "");
    state.selected = state.data[kind].find((item) => keyOf(item) === folder) || null;
    state.created = result.file;
    render();
  });
  $("detail").replaceChildren(form);
  name.focus();
}

function renderNotes() {
  const notes = $("notes");
  const lines = state.data ? state.data.notes : [];
  notes.hidden = !lines.length;
  notes.replaceChildren(...lines.map((line) => el("div", { text: line })));
}

function render() {
  if (!state.data) return;
  const error = $("error");
  error.hidden = !state.data.error;
  error.textContent = state.data.error || "";
  renderTabs();
  renderRepoFilter();
  renderList();
  renderDetail();
  renderNotes();
}

let lastCatalog = "";

function renderRepoFilter() {
  const select = $("repo-filter");
  const repos = state.data.repos || [];
  select.replaceChildren(
    el("option", { value: "", text: "All repositories" }),
    ...repos.map((path) => el("option", { value: path, text: path })),
  );
  select.value = state.repo;
}

async function load() {
  const query = state.repo ? `?repo=${encodeURIComponent(state.repo)}` : "";
  const response = await fetch(`/api/catalog${query}`, { cache: "no-store" });
  lastCatalog = await response.text();
  state.data = JSON.parse(lastCatalog);
}

async function refresh() {
  if (state.creating) return;
  try {
    const before = lastCatalog;
    await load();
    if (lastCatalog !== before) render();
  } catch (error) {
    console.debug("catalog refresh failed", error);
  }
}

setInterval(refresh, 2000);

$("repo-filter").addEventListener("change", async (event) => {
  state.repo = event.target.value;
  state.selected = null;
  state.created = null;
  await load();
  render();
});

$("search").addEventListener("input", (event) => {
  state.query = event.target.value;
  render();
});

$("new").addEventListener("click", () => {
  state.createKind = state.tab;
  state.creating = true;
  state.created = null;
  render();
});

load().then(render).catch((error) => {
  $("error").hidden = false;
  $("error").textContent = `Could not load the catalog: ${error}`;
});
</script>
</body>
</html>
