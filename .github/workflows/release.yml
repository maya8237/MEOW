name: Release

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*', 'v[0-9]*.[0-9]*.[0-9]*']
  pull_request:
    paths:
      - 'scripts/**'
      - 'src/meow/installer/**'
      - 'requirements-release.txt'
      - '.github/workflows/release.yml'
      - 'tests/installer/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: ruff check .
      - run: ruff format --check .

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, windows-latest, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build portable runtime, CLI, and Claude plugin
        env:
          # PR/manual builds validate against the package version, not branch names.
          GITHUB_REF_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python scripts/build_release.py
      - name: Exercise relocated bundle and streamed installer
        run: python scripts/smoke_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: meow-${{ matrix.os }}
          path: |
            dist/meow-*.tar.gz
            dist/meow-*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, validate]
    runs-on: ubuntu-latest
    concurrency:
      group: meow-release-publication
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Keep release names compatible with installed updaters
        run: echo "TAG=v${TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Read the current release channel
        run: |
          gh auth setup-git
          git init --initial-branch=release-channel channel
          cd channel
          git remote add origin "https://github.com/$GH_REPO.git"
          remote_head=$(git ls-remote --heads origin release-channel)
          if [ -n "$remote_head" ]; then
            git fetch origin release-channel
            git checkout -B release-channel FETCH_HEAD
          fi
          current=$(jq -r '.tag_name' latest.json 2>/dev/null || echo v0.0.0)
          newest=$(printf '%s\n%s\n' "$current" "$TAG" | sort -V | tail -1)
          if [ "$newest" = "$TAG" ]; then
            echo 'ADVANCE_CHANNEL=true' >> "$GITHUB_ENV"
          else
            echo 'ADVANCE_CHANNEL=false' >> "$GITHUB_ENV"
          fi
      - name: Publish a complete release after every platform passes
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --generate-notes --title "MEOW $TAG"
          fi
          gh release view "$TAG" --json isDraft,isPrerelease,assets > published.json
          if jq -e '.isDraft' published.json > /dev/null; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --draft=false --latest="$ADVANCE_CHANNEL"
          fi
          gh release view "$TAG" --json isDraft,isPrerelease,assets > published.json
          jq -e '.isDraft == false and .isPrerelease == false' published.json > /dev/null
          for asset in dist/*; do
            name=$(basename "$asset")
            jq -e --arg name "$name" 'any(.assets[]; .name == $name)' published.json > /dev/null
          done
      - name: Advance the raw-content release channel after publication
        if: env.ADVANCE_CHANNEL == 'true'
        working-directory: channel
        run: |
          jq -n --arg tag "$TAG" '{tag_name: $tag}' > latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json
          git diff --cached --quiet || git commit -m "Release $TAG"
          git push origin HEAD:release-channel
