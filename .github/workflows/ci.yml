name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install meow (editable, with dev extras)
        run: python -m pip install -e ".[dev]"
      # pytest also collects the plain `def test_*` modules that unittest
      # discovery skips. The full installer scripts also run directly in the
      # dedicated jobs below.
      - name: Run the test suite
        id: test-suite
        shell: bash
        run: python -m pytest -q -p no:cacheprovider 2>&1 | tee test-output.log
      # Job logs need sign-in; annotations are public, so surface the tail
      # of the captured output there on failure.
      - name: Surface test-suite failures as an annotation
        if: failure() && steps.test-suite.outcome == 'failure'
        shell: bash
        run: |
          tail -n 60 test-output.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}' | { printf '::error::'; cat; printf '\n'; }

  installer-linux:
    strategy:
      fail-fast: false
      matrix:
        installation: [fresh, preinstalled]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Preinstall MEOW for the existing-install test
        if: matrix.installation == 'preinstalled'
        run: python -m pip install -e .
      # In the fresh case, only the local installer may install MEOW.
      - name: Run the local Linux installer (${{ matrix.installation }})
        run: bash tests/installer/run_linux_install.sh "${{ matrix.installation }}"

  installer-windows:
    strategy:
      fail-fast: false
      matrix:
        installation: [fresh, preinstalled]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Preinstall MEOW for the existing-install test
        if: matrix.installation == 'preinstalled'
        run: python -m pip install -e .
      # Both cases evaluate the checkout's install.ps1 through iex.
      - name: Run the local Windows installer (${{ matrix.installation }})
        shell: pwsh
        run: ./tests/installer/run_windows_install.ps1 -Installation "${{ matrix.installation }}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install meow (editable, with dev extras)
        run: python -m pip install -e ".[dev]"
      - name: Run ruff
        run: |
          ruff check .
          ruff format --check .
