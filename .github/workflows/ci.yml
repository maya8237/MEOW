name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install meow (editable, with dev extras)
        run: python -m pip install -e ".[dev]"
      - name: Run installer script tests
        id: installer-tests
        shell: bash
        run: python -m pytest tests/installer/test_bootstrap_contract.py -q 2>&1 | tee installer-test-output.log
      - name: Surface installer-test failures as an annotation
        # Without failure(), GitHub adds an implicit success() and skips this.
        if: failure() && steps.installer-tests.outcome == 'failure'
        shell: bash
        run: |
          tail -n 120 installer-test-output.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}' | { printf '::error::'; cat; printf '\n'; }
      # pytest also collects the plain `def test_*` modules that unittest
      # discovery skips; the installer tests already ran above. bash keeps
      # pipefail on every OS, so `tee` cannot mask a failing exit code.
      - name: Run the test suite
        id: test-suite
        shell: bash
        run: python -m pytest -q -p no:cacheprovider --ignore=tests/installer/test_bootstrap_contract.py 2>&1 | tee test-output.log
      # Job logs need sign-in; annotations are public, so surface the tail
      # of the captured output there on failure.
      - name: Surface test-suite failures as an annotation
        if: failure() && steps.test-suite.outcome == 'failure'
        shell: bash
        run: |
          tail -n 60 test-output.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}' | { printf '::error::'; cat; printf '\n'; }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install meow (editable, with dev extras)
        run: python -m pip install -e ".[dev]"
      - name: Run ruff
        run: ruff check .
