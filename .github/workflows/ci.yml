name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a PR makes the older run's results moot; never cancel main or tags.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Lint frontend
        run: npm run lint
      - name: Check frontend formatting
        run: npm run format:check
      - name: Test UI interactions
        run: npm test
      - name: Build the local UI bundle
        run: npm run build
      - name: Verify the shipped UI matches the sources
        run: |
          git diff --exit-code -- ../src/meow/ui/static
          test -z "$(git ls-files --others --exclude-standard ../src/meow/ui/static)"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        exclude:
          # Only Windows is slow enough to be worth sharding.
          - os: ubuntu-latest
            shard: 2
          - os: ubuntu-latest
            shard: 3
          - os: ubuntu-latest
            shard: 4
          - os: ubuntu-latest
            shard: 5
          - os: ubuntu-latest
            shard: 6
          - os: ubuntu-latest
            shard: 7
          - os: ubuntu-latest
            shard: 8
    name: test (${{ matrix.os }}, ${{ matrix.python-version }}${{ matrix.os == 'windows-latest' && format(', shard {0}/8', matrix.shard) || '' }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      # The venv sits beside uv's cache (both under RUNNER_TEMP) so packages are
      # hardlinked instead of copied across drives, which is slow on Windows.
      - name: Install meow (editable, with dev extras)
        shell: bash
        run: |
          venv="$RUNNER_TEMP/venv"
          uv venv --python-preference only-system "$venv"
          bin="$venv/bin"
          [ -d "$venv/Scripts" ] && bin="$venv/Scripts"
          echo "$bin" >> "$GITHUB_PATH"
          VIRTUAL_ENV="$venv" uv pip install -e ".[dev]"
      # pytest also collects the plain `def test_*` modules that unittest
      # discovery skips. Portable installers are exercised by release.yml.
      - name: Run the test suite
        id: test-suite
        shell: bash
        env:
          MEOW_TEST_SHARD: ${{ matrix.os == 'windows-latest' && format('{0}/8', matrix.shard) || '1/1' }}
        run: python -m pytest -q -n 4 --dist worksteal -p no:cacheprovider --durations=30 --durations-min=0.1 2>&1 | tee test-output.log
      # Job logs need sign-in; annotations are public, so surface the tail
      # of the captured output there on failure.
      - name: Surface test-suite failures as an annotation
        if: failure() && steps.test-suite.outcome == 'failure'
        shell: bash
        run: |
          tail -n 60 test-output.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}' | { printf '::error::'; cat; printf '\n'; }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install meow (editable, with dev extras)
        run: uv pip install --system -e ".[dev]"
      - name: Run ruff
        run: |
          ruff check .
          ruff format --check .
