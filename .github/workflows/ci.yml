name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install meow (editable, with dev extras)
        run: python -m pip install -e ".[dev]"
      - name: Run the test suite
        run: python -m unittest discover -s tests -v 2>&1 | tee test-output.log
      - name: Run installer script tests
        run: python -m pytest tests/installer/test_bootstrap_contract.py -q 2>&1 | tee installer-test-output.log
      - name: Surface installer-test failures as an annotation
        if: failure()
        shell: bash
        run: |
          tail -n 120 installer-test-output.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}' | { printf '::error::'; cat; printf '\n'; }
      # GitHub's own log viewer requires sign-in even for a public repo, so
      # a failure's actual output is otherwise invisible to anyone without
      # an account. Annotations are readable through the public,
      # unauthenticated checks API, so surface the tail of the captured
      # output there on failure -- this is how the real cause of the
      # windows-latest failures this step guards against (see
      # test_fix_raises_on_exhaustion's ReviewFixAgent mock, added in the
      # same change as this step) was actually found.
      - name: Surface test-suite failures as an annotation
        if: failure()
        shell: bash
        run: |
          tail -n 60 test-output.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}' | { printf '::error::'; cat; printf '\n'; }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install meow (editable, with dev extras)
        run: python -m pip install -e ".[dev]"
      - name: Run ruff
        run: ruff check .
