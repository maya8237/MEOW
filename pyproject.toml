[project]
name = "meow"
version = "0.1.0"
description = "Planner/generator/evaluator harness engine for the Claude Agent SDK, reusable across projects via .harness.toml"
authors = [{ name = "Maya", email = "maya.yellin@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk",
    "tomli; python_version < '3.11'",
]

[project.scripts]
harness = "meow.orchestrator:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meow"]

[project.optional-dependencies]
dev = ["ruff"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
