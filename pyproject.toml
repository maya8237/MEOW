[project]
name = "meow"
version = "0.1.0"
description = "Planner/generator/reviewer harness engine for the Claude Agent SDK, reusable across projects via .harness.toml"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk",
]

[project.scripts]
meow = "meow.cli:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meow"]

[project.optional-dependencies]
dev = ["ruff", "pylint"]

[tool.ruff]
line-length = 88
src = ["src"]
preview = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C90", "PLR"]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.pylint]
max-args = 4
max-branches = 7
max-returns = 4
max-statements = 20
max-public-methods = 10
