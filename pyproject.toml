[project]
name = "meow"
version = "0.1.0"
description = "MEOW workflow engine for the Claude Agent SDK, configurable per project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk",
    "ipython",
    "structlog",
    "pywin32; sys_platform == 'win32'",
]

[project.scripts]
meow = "meow.cli.cli:cli_main"
mw = "meow.cli.cli:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meow"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/tests",
    "/.github",
    "/.gitlab-ci.yml",
    "/.pylintrc",
    "/AGENTS.md",
]

[project.optional-dependencies]
dev = ["pytest", "ruff==0.16.9", "pylint"]

[tool.ruff]
line-length = 88
src = ["src"]
preview = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C90", "PLR"]

[tool.ruff.lint.per-file-ignores]
"src/meow/__init__.py" = ["non-empty-init-module"]
"src/meow/project/shaping.py" = ["noqa-comments"]
"src/meow/cli/cli.py" = ["complex-structure", "too-many-branches", "line-too-long"]
"src/meow/cli/validation.py" = ["complex-structure", "too-many-branches"]
"src/meow/cli/dispatch.py" = ["complex-structure", "too-many-branches"]
"src/meow/project/config.py" = ["complex-structure", "too-many-statements"]
"src/meow/project/config_env.py" = ["complex-structure"]
"src/meow/project/config_schema.py" = ["complex-structure", "too-many-statements", "too-many-branches", "line-too-long"]
"src/meow/evaluation.py" = ["complex-structure", "too-many-branches", "too-many-statements"]
"src/meow/frontend.py" = ["complex-structure", "too-many-branches", "too-many-statements", "too-many-locals"]
"src/meow/integrations/knowledge.py" = ["complex-structure", "too-many-branches", "too-many-statements", "useless-if-else", "line-too-long"]
"src/meow/integrations/knowledge_documents.py" = ["complex-structure", "too-many-branches", "too-many-statements", "no-self-use", "line-too-long"]
"src/meow/execution/orchestrator.py" = ["too-many-statements"]
"src/meow/infrastructure/test_runner.py" = ["too-many-return-statements"]
"src/meow/agents/tester.py" = ["line-too-long"]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.pylint]
max-args = 4
max-branches = 7
max-returns = 4
max-statements = 20
max-public-methods = 10
