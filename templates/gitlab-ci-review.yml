# Include this job in a GitLab project whose merge requests target dev.
#
# Supply masked MEOW_API_KEY for Anthropic. For a custom gateway, optionally
# configure MEOW_API_URL and the gateway's MEOW_API_TOKEN or MEOW_API_KEY.
# LiteLLM/settings.json are not required. Values belong in CI settings only.
# Optional MEOW_MODEL and MEOW_DEFAULT_{OPUS,SONNET,HAIKU}_MODEL override models.
# Optional MR inline notes: supply masked MEOW_GITLAB_TOKEN (api scope), then add
# --post-comments gitlab to the review command for MR pipelines only.
# Match the job name to local hyphen/underscore conventions. Ask for stage/order,
# needs (default: none), manual mode (default: no), cancellation, and failure policy.
# Merge this policy into the host workflow; preserve its rules and other settings.
# It also cancels other interruptible jobs when a newer pipeline starts.
workflow:
  auto_cancel:
    on_new_commit: interruptible

meow_review:
  image: python:3.12
  stage: test
  needs: []
  interruptible: true
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev" && $CI_MERGE_REQUEST_EVENT_TYPE == "detached"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != "dev"'
      when: on_success
    - when: never
  variables:
    GIT_DEPTH: "0"
  before_script:
    - |
      if [ "${MEOW_API_URL+x}" = x ]; then
        export ANTHROPIC_BASE_URL="$MEOW_API_URL"
      fi
      if [ "${MEOW_API_TOKEN+x}" = x ]; then
        export ANTHROPIC_AUTH_TOKEN="$MEOW_API_TOKEN"
      fi
      if [ "${MEOW_API_KEY+x}" = x ]; then
        export ANTHROPIC_API_KEY="$MEOW_API_KEY"
      fi
      if [ "${MEOW_MODEL+x}" = x ]; then
        export ANTHROPIC_MODEL="$MEOW_MODEL"
      fi
      if [ "${MEOW_DEFAULT_OPUS_MODEL+x}" = x ]; then
        export ANTHROPIC_DEFAULT_OPUS_MODEL="$MEOW_DEFAULT_OPUS_MODEL"
      fi
      if [ "${MEOW_DEFAULT_SONNET_MODEL+x}" = x ]; then
        export ANTHROPIC_DEFAULT_SONNET_MODEL="$MEOW_DEFAULT_SONNET_MODEL"
      fi
      if [ "${MEOW_DEFAULT_HAIKU_MODEL+x}" = x ]; then
        export ANTHROPIC_DEFAULT_HAIKU_MODEL="$MEOW_DEFAULT_HAIKU_MODEL"
      fi
    - python -m pip install meow-harness
    - git fetch --no-tags origin refs/heads/dev:refs/remotes/origin/dev
  script:
    - meow review --ci --artifact-dir "$CI_PROJECT_DIR/.meow/ci-artifacts"
  artifacts:
    when: always
    paths:
      - .meow/ci-artifacts/
