# Include this job in a GitLab project with branch pipelines.
meow_review:
  image: python:3.12
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "dev"'
      when: on_success
    - when: never
  variables:
    GIT_DEPTH: "0"
    MEOW_INSTALL_SPEC: "meow"
  before_script:
    - python -m pip install "$MEOW_INSTALL_SPEC"
    - git fetch --no-tags origin refs/heads/dev:refs/remotes/origin/dev
  script:
    - meow review --ci --artifact-dir "$CI_PROJECT_DIR/.meow-ci-artifacts"
  artifacts:
    when: always
    paths:
      - .meow-ci-artifacts/
